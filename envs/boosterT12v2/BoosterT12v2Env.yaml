basic:
  task: "BoosterT12v2Env"
  checkpoint: -1
  headless: false
  max_iterations: 10000
  sim_device: "cuda:0"
  rl_device: "cuda:0"
  seed: 42
  algo: "sac"
  description: "2v2 Booster T1 IsaacGym environment for inference-first development"

env:
  num_observations: 47
  num_privileged_obs: 14
  num_actions: 12
  num_team_observations: 20
  env_spacing: 1.0

runner:
  horizon_length: 24
  mini_epochs: 20
  save_interval: 100
  use_wandb: false

viewer:
  pos: [12.0, -12.0, 8.0]
  lookat: [0.0, 0.0, 0.8]
  capture_for_policy: false
  policy_camera_mode: "topdown_center"
  policy_camera_center: [0.0, 0.0, 0.0]
  policy_camera_height: 11.0
  policy_camera_tilt_offset: [0.0, -0.8, 0.0]
  policy_light:
    index: 0
    color: [0.55, 0.55, 0.55]
    ambient: [0.45, 0.45, 0.45]
    direction: [0.2, 0.15, -1.0]
  record_video: false
  record_interval: 5.0
  record_env_idx: 0

algorithm:
  learning_rate: 1.0e-5
  gamma: 0.995
  lam: 0.95
  bound_coef: 1.0
  entropy_coef: -0.01
  symmetric_coef: 10.0
  desired_kl: 0.01

sim:
  dt: 0.002
  substeps: 1
  up_axis: "z"
  gravity: [0.0, 0.0, -9.81]
  physics_engine: "physx"
  physx:
    num_threads: 4
    solver_type: 1
    num_position_iterations: 4
    num_velocity_iterations: 1
    contact_offset: 0.02
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 100.0
    default_buffer_size_multiplier: 5.0
    max_gpu_contact_pairs: 8388608
    num_subscenes: 4
    contact_collection: 1

asset:
  file: "./resources/T1/T1_locomotion.urdf"
  mujoco_file: "./resources/T1/T1_locomotion.xml"
  name: "booster_t1"
  base_name: "Trunk"
  foot_names: ["left_foot_link", "right_foot_link"]
  disable_gravity: false
  default_dof_drive_mode: 3
  collapse_fixed_joints: true
  fix_base_link: false
  self_collisions: 0
  replace_cylinder_with_capsule: false
  flip_visual_attachments: false
  density: 10
  angular_damping: 0.0
  linear_damping: 0.0
  max_angular_velocity: 1000.0
  max_linear_velocity: 1000.0
  armature: 0.0
  thickness: 0.01
  feet_edge_pos: [[0.1215, 0.05, -0.03], [0.1215, -0.05, -0.03], [-0.1015, 0.05, -0.03], [-0.1015, -0.05, -0.03]]

init_state:
  pos: [0.0, 0.0, 0.72]
  rot: [0.0, 0.0, 0.0, 1.0]
  lin_vel: [0.0, 0.0, 0.0]
  ang_vel: [0.0, 0.0, 0.0]
  default_joint_angles: {"Hip_Pitch": -0.2, "Knee_Pitch": 0.4, "Ankle_Pitch": -0.25, "default": 0.0}

control:
  stiffness: {"Hip": 200.0, "Knee": 200.0, "Ankle": 50.0}
  damping: {"Hip": 5.0, "Knee": 5.0, "Ankle": 1.0}
  action_scale: 1.0
  decimation: 10

terrain:
  type: "plane"
  static_friction: 1.0
  dynamic_friction: 1.0
  restitution: 0.0

commands:
  num_commands: 3
  still_proportion: 0.1
  lin_vel_x: [-1.0, 1.0]
  lin_vel_y: [-1.0, 1.0]
  ang_vel_yaw: [-1.0, 1.0]
  resampling_time_s: [8.0, 12.0]
  gait_frequency: [1.0, 2.0]
  update_rate: 0.1
  lin_vel_levels: 10
  ang_vel_levels: 10
  lin_vel_x_resolution: 0.2
  lin_vel_y_resolution: 0.1
  ang_vel_resolution: 0.2
  episode_length_toler: 0.1
  lin_vel_x_toler: 0.4
  lin_vel_y_toler: 0.2
  ang_vel_yaw_toler: 0.2

normalization:
  gravity: 1.0
  lin_vel: 1.0
  ang_vel: 1.0
  dof_pos: 1.0
  dof_vel: 0.1
  filter_weight: 0.1
  push_force: 0.1
  push_torque: 0.5
  clip_actions: 1.0

game:
  num_home: 2
  num_away: 2
  episode_length_steps: 1000
  ball_radius: 0.11
  spawn:
    home_x: -3.5
    away_x: 3.5
    y_offsets: [-1.5, 1.5]
  ball_dynamics:
    density: 80.0
    linear_damping: 0.015
    angular_damping: 0.01
    max_angular_velocity: 100.0
  field:
    enable_markings: true
    enable_goals: true
    enable_grass_strips: false
    enable_ground_patch: true
    length: 14.0
    width: 9.0
    line_width: 0.05
    line_thickness: 0.015
    center_circle_radius: 1.5
    goal_area_length: 1.0
    goal_area_width: 4.0
    penalty_area_length: 3.0
    penalty_area_width: 6.0
    penalty_mark_distance: 2.1
    border_strip_width: 1.0
    goal_width: 2.6
    goal_height: 1.8
    goal_depth: 0.6
    goal_post_size: 0.10

midlevel:
  eval_mode: true
  policies:
    move_to_target:
      checkpoint: null
      glob: "core/checkpoints/mid_level/chaseBall/*.pt"
    pass_to_target:
      checkpoint: null
      glob: "core/checkpoints/mid_level/passBall/sac/*.pt"
    trap_ball:
      checkpoint: null
      glob: null
