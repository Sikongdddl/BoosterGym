basic:
  checkpoint: null # set to -1 to load last saved model
  headless: false
  max_iterations: 10000 # set the maximum number of learning iterations to train for
  sim_device: "cuda:0" # device for physics simulation
  rl_device: "cuda:0" # device for the RL algorithm
  seed: -1 # seed - set to -1 to choose random seed
  algo: "sac" # high-level RL algorithm: dqn or sac
  description: ""

env:
  num_observations: 47
  num_privileged_obs: 14
  num_actions: 12
  env_spacing: 1.  # not used with plane terrain

runner:
  horizon_length: 24
  mini_epochs: 20
  save_interval: 100
  use_wandb: true

viewer:
  pos: [3., -3., 2.]  # [m]
  lookat: [0., 0., 0.]  # [m]
  record_video: false  # only in play
  record_interval: 5.  # [s]
  record_env_idx: 0

algorithm:
  learning_rate: 1.e-5
  gamma: 0.995
  lam: 0.95
  bound_coef: 1.0
  entropy_coef: -0.01
  symmetric_coef: 10.
  desired_kl: 0.01

sim:
  dt: 0.002
  substeps: 1
  up_axis: "z"
  gravity: [0.0, 0.0, -9.81]
  physics_engine: "physx" # "physx" or "flex"
  physx:
    num_threads: 4 # Number of worker threads per scene used by PhysX - for CPU PhysX only.
    solver_type: 1 # 0: pgs, 1: tgs
    num_position_iterations: 4
    num_velocity_iterations: 1
    contact_offset: 0.02
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 100.0
    default_buffer_size_multiplier: 5.0
    max_gpu_contact_pairs: 8388608 # 8*1024*1024
    num_subscenes: 4 # Splits the simulation into N physics scenes and runs each one in a separate thread
    contact_collection: 1 # 0: CC_NEVER (don't collect contact info), 1: CC_LAST_SUBSTEP (collect only contacts on last substep), 2: CC_ALL_SUBSTEPS (broken - do not use!)

asset:
  file: "./resources/T1/T1_locomotion.urdf"
  mujoco_file: "./resources/T1/T1_locomotion.xml"
  name: "play_field"
  base_name: "Trunk"
  foot_names: ["left_foot_link", "right_foot_link"]
  disable_gravity: false
  default_dof_drive_mode: 3 # see GymDofDriveModeFlags (0 is none, 1 is pos tgt, 2 is vel tgt, 3 effort)
  collapse_fixed_joints: true # bug: if collapse_fixed_joints = false, foot doesn't collide with ground
  fix_base_link: false # fix the base of the robot
  self_collisions: 0 # 1 to disable, 0 to enable...bitwise filter
  replace_cylinder_with_capsule: false # replace collision cylinders with capsules, leads to faster/more stable simulation
  flip_visual_attachments: false # Some .obj meshes must be flipped from y-up to z-up
  density: 10 # which mean nothing because of fix-numbers in rigid mass
  angular_damping: 0.
  linear_damping: 0.
  max_angular_velocity: 1000.
  max_linear_velocity: 1000.
  armature: 0.
  thickness: 0.01
  feet_edge_pos: [[ 0.1215,  0.05, -0.03],
                  [ 0.1215, -0.05, -0.03],
                  [-0.1015,  0.05, -0.03],
                  [-0.1015, -0.05, -0.03]] # x,y,z [m]

init_state:
  pos: [0.0, 0.0, 0.72] # x,y,z [m]
  rot: [0.0, 0.0, 0.0, 1.0] # x,y,z,w [quat]
  lin_vel: [0.0, 0.0, 0.0]  # x,y,z [m/s]
  ang_vel: [0.0, 0.0, 0.0]  # x,y,z [rad/s]
  default_joint_angles: {"Hip_Pitch": -0.2, "Knee_Pitch": 0.4, "Ankle_Pitch": -0.25, "default": 0.} # target angles when action = 0.0

control:
  stiffness: {"Hip": 200., "Knee": 200., "Ankle": 50.} # [N*m/rad]
  damping: {"Hip": 5., "Knee": 5., "Ankle": 1.} # [N*m*s/rad]
  action_scale: 1.
  decimation: 10

terrain:
  type: "plane" # "plane" or "trimesh"
  static_friction: 1.0  # [-]
  dynamic_friction: 1.0  # [-]
  restitution: 0.        # [-]

commands:
  num_commands: 3 # default: lin_vel_x, lin_vel_y, ang_vel_yaw
  still_proportion: 0.1
  lin_vel_x: [-1.0, 1.0] # min max [m/s]
  lin_vel_y: [-1.0, 1.0] # min max [m/s]
  ang_vel_yaw: [-1, 1]   # min max [rad/s]
  resampling_time_s: [8., 12.]
  gait_frequency: [1.0, 2.0] # min max [Hz]
  update_rate: 0.1
  lin_vel_levels: 10
  ang_vel_levels: 10
  lin_vel_x_resolution: 0.2 # [m/s]
  lin_vel_y_resolution: 0.1 # [m/s]
  ang_vel_resolution: 0.2 # [rad/s]
  episode_length_toler: 0.1
  lin_vel_x_toler: 0.4 # [m/s]
  lin_vel_y_toler: 0.2 # [m/s]
  ang_vel_yaw_toler: 0.2 # [rad/s]

normalization:
  gravity: 1.0
  lin_vel: 1.0
  ang_vel: 1.0
  dof_pos: 1.0
  dof_vel: 0.1
  filter_weight: 0.1
  push_force: 0.1
  push_torque: 0.5
  clip_actions: 1.

noise:
  gravity:
    range: [0., 0.01]
    operation: "additive"
    distribution: "gaussian"
  lin_vel:
    range: [0., 0.05]
    operation: "additive"
    distribution: "gaussian"
  ang_vel:
    range: [0., 0.1]
    operation: "additive"
    distribution: "gaussian"
  dof_pos:
    range: [0., 0.01]
    operation: "additive"
    distribution: "gaussian"
  dof_vel:
    range: [0., 0.1]
    operation: "additive"
    distribution: "gaussian"
  height:
    range: [0., 0.02]
    operation: "additive"
    distribution: "gaussian"

randomization:
  init_dof_pos:
    range: [0., 0.05]
    operation: "additive"
    distribution: "gaussian"
  init_base_pos_xy:
    range: [-1., 1.]
    operation: "additive"
    distribution: "uniform"
  init_base_lin_vel_xy:
    range: [0., 0.1]
    operation: "additive"
    distribution: "gaussian"

  kick_interval_s: 2.
  kick_lin_vel:
    range: [0., 0.1]
    operation: "additive"
    distribution: "gaussian"
  kick_ang_vel:
    range: [0., 0.02]
    operation: "additive"
    distribution: "gaussian"

  push_interval_s: 5.
  push_duration_s: 1.
  push_force:
    range: [0., 10.]
    operation: "additive"
    distribution: "gaussian"
  push_torque:
    range: [0., 2.]
    operation: "additive"
    distribution: "gaussian"

  dof_stiffness:
    range: [0.95, 1.05]
    operation: "scaling"
    distribution: "uniform"
  dof_damping:
    range: [0.95, 1.05]
    operation: "scaling"
    distribution: "uniform"
  dof_friction:
    range: [0.0, 2.0]
    operation: "additive"
    distribution: "uniform"

  friction:
    range: [0.1, 2.0]
    operation: "additive"
    distribution: "uniform"
  compliance:
    range: [0.5, 1.5]
    operation: "additive"
    distribution: "uniform"
  restitution:
    range: [0.1, 0.9]
    operation: "additive"
    distribution: "uniform"

  base_com:
    range: [-0.1, 0.1]
    operation: "additive"
    distribution: "uniform"
  base_mass:
    range: [0.8, 1.2]
    operation: "scaling"
    distribution: "uniform"
  other_com:
    range: [-0.005, 0.005]
    operation: "additive"
    distribution: "uniform"
  other_mass:
    range: [0.98, 1.02]
    operation: "scaling"
    distribution: "uniform"

rewards:
  scales:
    survival: 0.25
    tracking_lin_vel_x: 1.0
    tracking_lin_vel_y: 1.0
    tracking_ang_vel: 0.5
    base_height: -20.
    orientation: -5.
    torques: -2.e-4
    torque_tiredness: -1.e-2
    power: -2.e-3
    lin_vel_z: -2.
    ang_vel_xy: -0.2
    dof_vel: -1.e-4
    dof_acc: -1.e-7
    root_acc: -1.e-4
    action_rate: -1.
    dof_pos_limits: -1.
    dof_vel_limits: -0.
    torque_limits: -0.
    collision: -1.
    feet_slip: -0.1
    feet_vel_z: -0.
    feet_yaw_diff: -1.
    feet_yaw_mean: -1.
    feet_roll: -0.1
    feet_distance: -1.
    feet_swing: 3.
  episode_length_s: 30.
  terminate_height: 0.45
  terminate_vel: 50.
  terminate_contacts_on: []
  penalize_contacts_on: ["Trunk", "H1", "H2", "AL", "AR", "Waist", "Hip", "Shank", "Ankle"]
  only_positive_rewards: true # if true negative total rewards are clipped at zero (avoids early termination problems)
  tracking_sigma: 0.25 # tracking reward = exp(-error^2/sigma)
  base_height_target: 0.68
  soft_dof_pos_limit: 1. # percentage of urdf limits, values above this limit are penalized
  soft_dof_vel_limit: 1.
  soft_torque_limit: 1.
  swing_period: 0.2
  feet_distance_ref: 0.2

curriculum:
  sample_sigma: 0.2
  sample_epsilon: 0.1
  sample_success_bonus: 1.2
  sample_hard_focus: 0.0
  sample_rmax_ema_beta: 0.9

  dribble_vx_min: -0.10
  dribble_vx_max: 0.60
  dribble_cmd_smooth: 0.35
  dribble_action_repeat: 10

  dribble_stage_enabled: true
  dribble_stage_initial: 0
  dribble_stage_success_window: 100
  # 课程成功分数 = clip(本轮最大连续控球步数 / 该目标值, 0, 1)
  dribble_control_streak_target: 24
  dribble_stage_min_episodes: 60
  dribble_stage_cooldown: 12
  dribble_stage_up_thresh: 0.65
  dribble_stage_down_thresh: 0.30
  dribble_w_control: [1.2, 0.95, 0.75]
  dribble_w_turn: [0.1, 1.1, 0.9]
  dribble_w_drive: [0.0, 0.35, 1.2]
  dribble_w_soft_pass: [0.85, 1.15, 0.90]
  dribble_w_reposition: [0.20, 0.90, 1.20]
  dribble_w_ball_progress: [0.45, 0.65, 0.85]

  # 场景难度课程（按 stage=0/1/2 生效）
  # 若不填 *_stages，会回退到下面这些 base 键并自动生成三档默认值
  dribble_target_dist_min: 2.0
  dribble_target_dist_max: 3.0
  dribble_target_angle_abs_min_deg: 35.0
  dribble_target_angle_abs_max_deg: 150.0
  dribble_target_dist_min_stages: [2.0, 2.4, 2.8]
  dribble_target_dist_max_stages: [3.0, 3.5, 4.0]
  dribble_target_angle_abs_min_deg_stages: [20.0, 35.0, 55.0]
  dribble_target_angle_abs_max_deg_stages: [110.0, 150.0, 170.0]

  dribble_ball_spawn_dist_min: 0.25
  dribble_ball_spawn_dist_max: 0.42
  dribble_ball_spawn_lateral_abs: 0.12
  dribble_ball_spawn_dist_min_stages: [0.22, 0.25, 0.30]
  dribble_ball_spawn_dist_max_stages: [0.36, 0.42, 0.50]
  dribble_ball_spawn_lateral_abs_stages: [0.07, 0.12, 0.20]

  dribble_control_dist: 0.55
  dribble_control_front_min: 0.04
  dribble_control_lateral_max: 0.30
  dribble_control_hold_steps: 6
  dribble_success_target_radius: 0.45
  dribble_success_target_hold_steps: 6

  dribble_heading_gate_cos: 0.70
  dribble_pass_speed_ref: 0.85
  dribble_pass_speed_sigma: 0.30
  dribble_pass_reposition_min_toward: 0.12
  dribble_reposition_front_ref: 0.20
  dribble_reposition_front_sigma: 0.16
  dribble_reposition_lateral_sigma: 0.22

  dribble_spin_yaw_thr: 1.2
  dribble_ball_speed_soft: 1.8
  dribble_ball_rel_speed_soft: 1.4
  dribble_lost_ball_soft: 0.95
  dribble_fail_ball_dist: 1.6

  dribble_time_penalty: 0.010
  dribble_spin_penalty_scale: 0.25
  dribble_ball_speed_penalty_scale: 0.18
  dribble_rel_speed_penalty_scale: 0.12
  dribble_lost_ball_penalty_scale: 0.75
  dribble_fall_penalty: 18.0
  dribble_fail_penalty: 6.0
  dribble_success_bonus: 8.0
 
